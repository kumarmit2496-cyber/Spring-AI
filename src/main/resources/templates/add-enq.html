<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Enquiry</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .card-custom {
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .navbar-custom {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 10px;
            padding: 10px 25px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Counsellor Portal</a>
        <div>
            <a class="btn btn-outline-light me-2" href="dashboard">Dashboard</a>
            <a class="btn btn-light me-2" href="enquiry">Add Enquiry</a>
            <a class="btn btn-outline-light me-2" href="view-enquiries">View Enquiries</a>
            <a class="btn btn-danger" href="logout">Logout</a>
        </div>
    </div>
</nav>

<!-- FORM SECTION -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card card-custom p-4">
                <h3 class="text-center mb-4 fw-bold text-primary">
                    Add New Enquiry
                </h3>

                <!-- SUCCESS MESSAGE -->
                <div th:if="${successMsg}"
                     class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMsg}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- ERROR MESSAGE -->
                <div th:if="${errorMsg}"
                     class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMsg}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/enquiry}" th:object="${enquiry}" method="post">

                    <!-- Hidden ID for Edit -->
                    <input type="hidden" th:field="*{enqId}">


                    <!-- Student Name -->
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control"
                               th:field="*{stuName}" placeholder="Enter student name" required>
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label class="form-label">Student Phone</label>
                        <input type="text" class="form-control"
                               th:field="*{stuPhno}" placeholder="Enter phone number" required>
                    </div>

                    <!-- Course -->
                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <select class="form-select" th:field="*{courseId}" required>
                            <option value="">Select Course</option>
                            <option th:each="course : ${courses}"
                                    th:value="${course.courseId}"
                                    th:text="${course.courseName}">
                            </option>
                        </select>
                    </div>

                    <!-- Class Mode -->
                    <div class="mb-3">
                        <label class="form-label">Class Mode</label>
                        <select class="form-select" th:field="*{classMode}" required>
                            <option value="">Select Mode</option>
                            <option value="Online">Online</option>
                            <option value="Classroom">Classroom</option>
                        </select>
                    </div>

                    <!-- Enquiry Status -->
                    <div class="mb-4">
                        <label class="form-label">Enquiry Status</label>
                        <select class="form-select" th:field="*{enqStatus}" required>
                            <option value="">Select Status</option>
                            <option value="OPEN">Open</option>
                            <option value="ENROLLED">Enrolled</option>
                            <option value="LOST">Lost</option>
                        </select>
                    </div>

                    <!-- Submit -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-custom">
                            Save Enquiry
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auto Hide Alert After 3 Seconds -->
<script>
    setTimeout(function () {
        let alert = document.querySelector(".alert");
        if (alert) {
            alert.classList.remove("show");
            alert.classList.add("fade");
            setTimeout(() => alert.remove(), 500);
        }
    }, 3000);
</script>

</body>
</html>
