<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>AI Resume Builder</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
body {
	background: #eef2f7;
	font-family: "Segoe UI", sans-serif;
}

/* SIDEBAR */
.sidebar {
	height: 100vh;
	width: 230px;
	position: fixed;
	background: #1f2a40;
	padding-top: 20px;
}

.sidebar h4 {
	color: white;
	text-align: center;
	margin-bottom: 30px;
}

.sidebar a {
	display: block;
	padding: 12px;
	color: white;
	margin: 6px 10px;
	border-radius: 8px;
	text-decoration: none;
	transition: 0.3s;
}

.sidebar a:hover {
	transform: translateX(5px);
	opacity: 0.9;
}

/* MENU COLORS */
.menu-ai {
	background: #4e73df;
}

.menu-travel {
	background: #1cc88a;
}

.menu-image {
	background: #f6c23e;
}

.menu-email {
	background: #e74a3b;
}

.menu-resume {
	background: #6f42c1;
}

/* ACTIVE MENU */
.active-menu {
	border: 2px solid white;
}

/* CONTENT */
.content {
	margin-left: 240px;
	padding: 30px;
}

/* CARD */
.box {
	background: white;
	padding: 30px;
	border-radius: 12px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}

/* BUTTON */
.btn-custom {
	background: #6f42c1;
	color: white;
	font-weight: 500;
}

.btn-custom:hover {
	background: #5a32a3;
}

/* RESUME OUTPUT */
.resume-output {
	background: #ffffff;
	padding: 25px;
	border-radius: 10px;
	border-left: 5px solid #6f42c1;
	line-height: 1.8;
	white-space: pre-line; /* 🔥 IMPORTANT FIX */
	font-size: 15px;
}
</style>

</head>

<body>

	<!-- SIDEBAR -->
	<div class="sidebar">

		<h4>🤖 AI Tools</h4>

		<a th:href="@{/}" class="menu-ai"> <i class="bi bi-chat-dots"></i>
			Ask AI
		</a> <a th:href="@{/showTravelGuide}" class="menu-travel"> <i
			class="bi bi-airplane"></i> Travel Guide
		</a> <a th:href="@{/imageGenerator}" class="menu-image"> <i
			class="bi bi-image"></i> Image Generator
		</a> <a th:href="@{/emailWriter}" class="menu-email"> <i
			class="bi bi-envelope"></i> Email Writer
		</a> <a th:href="@{/resumeBuilder}" class="menu-resume active-menu"> <i
			class="bi bi-file-earmark-person"></i> Resume Builder
		</a>

	</div>

	<!-- CONTENT -->
	<div class="content">

		<div class="box">

			<h3 class="text-center mb-4">
				<i class="bi bi-file-earmark-person"></i> AI Resume Builder
			</h3>

			<!-- FORM -->
			<form th:action="@{/resumeBuilder}" method="post">

				<div class="row">

					<div class="col-md-6 mb-3">
						<label class="form-label">Full Name</label> <input type="text"
							name="name" class="form-control" placeholder="Enter your name"
							required>
					</div>

					<div class="col-md-6 mb-3">
						<label class="form-label">Target Role</label> <input type="text"
							name="role" class="form-control"
							placeholder="Java Developer / Backend Engineer" required>
					</div>

					<div class="col-md-6 mb-3">
						<label class="form-label">Skills</label>
						<textarea name="skills" class="form-control" rows="3"
							placeholder="Java, Spring Boot, Microservices..." required></textarea>
					</div>

					<div class="col-md-6 mb-3">
						<label class="form-label">Experience</label>
						<textarea name="experience" class="form-control" rows="3"
							placeholder="2+ years experience..." required></textarea>
					</div>

				</div>

				<button class="btn btn-custom w-100 mt-2">
					<i class="bi bi-stars"></i> Generate Resume
				</button>

			</form>

			<!-- OUTPUT -->
			<div class="mt-4" th:if="${resume}">

				<h5 class="mb-3 text-success">
					<i class="bi bi-robot"></i> Generated Resume
				</h5>

				<!-- ✅ FIXED OUTPUT -->
				<div class="resume-output" th:text="${resume}"></div>

			</div>
			<div class="mt-3" th:if="${resume}">
				<a href="/downloadResume" class="btn btn-success w-100"> <i
					class="bi bi-download"></i> Download as PDF
				</a>
			</div>

		</div>

	</div>

</body>
</html>
