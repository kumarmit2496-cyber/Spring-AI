<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .navbar-custom {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
        }

        .card-custom {
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card-custom:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Counsellor Portal</a>

        <div class="d-flex align-items-center">

            <a class="btn btn-light me-2" href="dashboard">Dashboard</a>
            <a class="btn btn-outline-light me-2" href="enquiry">Add Enquiry</a>
            <a class="btn btn-outline-light me-3" href="view-enquiries">View Enquiries</a>

            <!-- Username -->
            <span class="text-white fw-bold me-3">
                Welcome,
                <span th:text="${session.CNAME}"></span>
            </span>

            <!-- Logout -->
            <a class="btn btn-danger" href="logout">Logout</a>

        </div>
    </div>
</nav>

<!-- DASHBOARD SECTION -->
<div class="container mt-5">
    <h2 class="text-center text-white mb-4 fw-bold">
        Dashboard Overview
    </h2>

    <div class="row g-4">

        <!-- Total Enquiries -->
        <div class="col-md-3">
            <div class="card card-custom text-center p-4 bg-white">
                <h6 class="text-muted">Total Enquiries</h6>
                <div class="stat-number text-primary"
                     th:text="${dashboardInfo != null ? dashboardInfo.totalEnqs : 0}">
                    0
                </div>
            </div>
        </div>

        <!-- Open Enquiries -->
        <div class="col-md-3">
            <div class="card card-custom text-center p-4 bg-white">
                <h6 class="text-muted">Open Enquiries</h6>
                <div class="stat-number text-warning"
                     th:text="${dashboardInfo != null ? dashboardInfo.openEnqs : 0}">
                    0
                </div>
            </div>
        </div>

        <!-- Enrolled -->
        <div class="col-md-3">
            <div class="card card-custom text-center p-4 bg-white">
                <h6 class="text-muted">Enrolled</h6>
                <div class="stat-number text-success"
                     th:text="${dashboardInfo != null ? dashboardInfo.enrolledEnq : 0}">
                    0
                </div>
            </div>
        </div>

        <!-- Lost Enquiries -->
        <div class="col-md-3">
            <div class="card card-custom text-center p-4 bg-white">
                <h6 class="text-muted">Lost Enquiries</h6>
                <div class="stat-number text-danger"
                     th:text="${dashboardInfo != null ? dashboardInfo.lostEnqs : 0}">
                    0
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
