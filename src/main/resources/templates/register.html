<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Counsellor Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #6f42c1, #20c997);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .register-title {
            font-weight: bold;
            color: #6f42c1;
        }

        .btn-custom {
            background-color: #6f42c1;
            border: none;
        }

        .btn-custom:hover {
            background-color: #5936a2;
        }

        .login-link {
            text-decoration: none;
            font-weight: 500;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h3 class="text-center register-title mb-4">Create Account</h3>

    <!-- ✅ Success Message -->
    <div th:if="${smsg}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
        <span th:text="${smsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ✅ Error Message -->
    <div th:if="${emsg}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
        <span th:text="${emsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/register}" th:object="${counsellor}" method="post">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email"
                   th:field="*{email}"
                   class="form-control"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   th:field="*{pwd}"
                   class="form-control"
                   placeholder="Create password"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel"
                   th:field="*{phno}"
                   class="form-control"
                   placeholder="Enter phone number"
                   required>
        </div>

        <div class="d-grid mt-3">
            <button type="submit" class="btn btn-custom text-white">
                Register
            </button>
        </div>

    </form>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="login-link text-primary">
            Already have an account? Login
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
