<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>AI Email Writer</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
body {
	background: #eef2f7;
	font-family: Arial;
}

/* SIDEBAR */
.sidebar {
	height: 100vh;
	width: 230px;
	position: fixed;
	background: #1f2a40;
	padding-top: 20px;
}

.sidebar h4 {
	color: white;
	text-align: center;
	margin-bottom: 30px;
}

.sidebar a {
	display: block;
	padding: 15px;
	text-decoration: none;
	font-size: 16px;
	color: white;
	margin: 5px 10px;
	border-radius: 8px;
}

.sidebar a:hover {
	opacity: 0.9;
}

/* MENU COLORS */
.menu-ai {
	background: #4e73df;
}

.menu-travel {
	background: #1cc88a;
}

.menu-image {
	background: #f6c23e;
}

.menu-email {
	background: #e74a3b;
}

/* CONTENT */
.content {
	margin-left: 240px;
	padding: 40px;
}

.travel-container {
	max-width: 900px;
	margin: auto;
	background: white;
	padding: 30px;
	border-radius: 12px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}

.response-card {
	margin-top: 25px;
}
</style>

</head>

<body>

	<!-- SIDEBAR -->

	<div class="sidebar">

		<h4>🤖 AI Tools</h4>

		<a href="/" class="menu-ai"> <i class="bi bi-chat-dots"></i> Ask
			AI
		</a> <a href="/showTravelGuide" class="menu-travel"> <i
			class="bi bi-airplane"></i> Travel Guide
		</a> <a href="/imageGenerator" class="menu-image"> <i
			class="bi bi-image"></i> Image Generator
		</a> <a href="/emailWriter" class="menu-email"> <i
			class="bi bi-envelope"></i> Email Writer
		</a>

	</div>


	<!-- MAIN CONTENT -->

	<div class="content">

		<div class="email-container">

			<h3 class="text-center mb-4">
				<i class="bi bi-envelope"></i> AI Email Writer
			</h3>

			<form th:action="@{/emailWriter}" method="post">

				<div class="row">

					<div class="col-md-6 mb-3">
						<label class="form-label">Recipient</label> <input type="text"
							class="form-control" name="recipient"
							placeholder="Manager / HR / Client" required>
					</div>

					<div class="col-md-6 mb-3">
						<label class="form-label">Tone</label> <select class="form-select"
							name="tone">
							<option>Professional</option>
							<option>Friendly</option>
							<option>Formal</option>
							<option>Apology</option>
							<option>Request</option>
						</select>

					</div>

				</div>

				<div class="mb-3">

					<label class="form-label">Email Subject</label> <input type="text"
						class="form-control" name="subject"
						placeholder="Leave request / Meeting follow-up" required>

				</div>

				<div class="d-grid">

					<button class="btn btn-primary btn-lg">
						<i class="bi bi-stars"></i> Generate Email
					</button>

				</div>

			</form>


			<!-- AI RESPONSE -->

			<div class="card shadow response-card" th:if="${email}">

				<div class="card-header bg-success text-white">
					<i class="bi bi-robot"></i> Generated Email
				</div>

				<div class="card-body">
					<div class="email-output" th:text="${email}"></div>
				</div>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
